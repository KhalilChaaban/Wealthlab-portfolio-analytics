[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthlab-research"
version = "1.0.0"
description = "Multi-asset portfolio accounting and illustrative client wealth planning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
live = ["yfinance>=0.2.54,<2", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
include = ["wealthlab*"]
